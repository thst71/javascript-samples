<!DOCTYPE html>
<html>

<head>
    <script>
        console.log("Ich bin im Head vor script: readyState==" + document.readyState);
    </script>
    <script async src="async-script-1.js"></script>
    <script defer src="defer-script-1.js"></script>
    <script defer src="defer-script-2.js"></script>
    <script async src="async-script-2.js"></script>
    <script>
        console.log("Ich bin im Head nach script: readyState==" + document.readyState);
    </script>

    <script>
        function onload() {
            console.log("Ich bin in onLoad(): readyState==" + document.readyState);
        }
    </script>
</head>

<body onload="onload()">
<script>
    console.log("Ich bin im Body 1: readyState==" + document.readyState);
</script>

<h1>Dies ist eine Überschrift</h1>
<script>
    console.log("Ich bin im Body 2, vor der Pause: readyState==" + document.readyState);
    let nowb2 = new Date().getTime();
    while (new Date().getTime() < nowb2 + 500) {
    }
    console.log("Ich bin im Body 2, nach der Pause: readyState==" + document.readyState, new Date());
</script>
</body>

</html>
